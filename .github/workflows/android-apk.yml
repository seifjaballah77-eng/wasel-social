name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then ./gradlew --no-daemon assembleDebug; else
            echo "Gradle wrapper is missing. Generate and commit gradlew first."
            exit 1
          fi
      - name: Publish APK to rolling GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Seif Messages Android (latest build)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
